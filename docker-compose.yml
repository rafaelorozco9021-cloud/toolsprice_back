version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: toolsprece
      POSTGRES_USER: toolsprece
      POSTGRES_PASSWORD: toolsprece
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://toolsprece:toolsprece@db:5432/toolsprece
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=supersecretkey123
      - JWT_EXPIRE_MINUTES=60
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000

volumes:
  pgdata: